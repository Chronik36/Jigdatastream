name: Build BotTrack for Mac and Windows
on:
  push:
    branches: [main, claude/order-tracker-llm]
    paths: ["jigstream/**", "packaging/**", "requirements.txt", "android/**", ".github/workflows/build-mac.yml"]
  workflow_dispatch:
concurrency:
  group: build-mac-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The Android app ships in the same release as the Mac app, so phones can be offered it.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.14.3"}
      - name: Build the APK with the fixed signing key, so it installs over older versions
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_B64 secret, so the Android app is left out of this release (see packaging/RELEASES.md)."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/beta.keystore"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/beta.keystore"
          cd android && gradle --no-daemon assembleRelease
          v=$(sed -n 's/^ *versionCode \([0-9]*\).*/\1/p' app/build.gradle)
          mkdir -p ../apk && cp app/build/outputs/apk/release/app-release.apk "../apk/BotTrack-android-$v.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: BotTrack-android
          path: apk/
          if-no-files-found: ignore
          retention-days: 30

  # The Windows installer ships in the same release too.
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: powershell -ExecutionPolicy Bypass -File packaging/windows/build_windows.ps1 -Out dist
        env:
          BOTTRACK_BUILD: build-${{ github.run_number }}-${{ github.sha }}
          BOTTRACK_DEVELOPER_EMAIL: ${{ secrets.BOTTRACK_LOGS_TO }}
      - uses: actions/upload-artifact@v4
        with:
          name: BotTrack-windows
          path: dist/BotTrack-Setup.exe
          retention-days: 30

  build:
    needs: [android, windows]
    if: ${{ !cancelled() }}  # a broken Android or Windows build never holds back the Mac app
    runs-on: macos-latest  # Apple Silicon
    timeout-minutes: 30
    env:
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN || secrets.BOTTRACK }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: bash packaging/build_app.sh dist
        env:
          BOTTRACK_BUILD: build-${{ github.run_number }}-${{ github.sha }}
          BOTTRACK_DEVELOPER_EMAIL: ${{ secrets.BOTTRACK_LOGS_TO }}
      - name: Smoke test the bundled Python and code
        run: |
          D=$(mktemp -d); hdiutil attach dist/BotTrack.dmg -mountpoint "$D" -nobrowse
          R="$D/BotTrack.app/Contents/Resources"
          PYTHONPATH="$R/app" "$R/python/bin/python3" -c "import flask, webview, mlx_lm, jigstream.macapp, jigstream.app; jigstream.app.create_app('/tmp/t.db'); print('imports ok')"
          "$R/ollama/ollama" --version || true
          # The Manual as one HTML file for the release (made with the app's own Python and code).
          PYTHONPATH="$R/app" "$R/python/bin/python3" packaging/export_manual.py dist/BotTrack-Manual.html || echo "manual export failed"
          hdiutil detach "$D"
      - uses: actions/upload-artifact@v4
        with:
          name: BotTrack-dmg
          path: dist/BotTrack.dmg
          retention-days: 30
      # Builds of main become a release in the public releases-only repository, where the app
      # checks for updates without a token. Needs the RELEASES_TOKEN secret (see packaging/RELEASES.md).
      - uses: actions/download-artifact@v4
        if: github.ref == 'refs/heads/main' && env.RELEASES_TOKEN != ''
        continue-on-error: true  # no Android app when the signing key isn't set up
        with: {name: BotTrack-android, path: apk}
      - uses: actions/download-artifact@v4
        if: github.ref == 'refs/heads/main' && env.RELEASES_TOKEN != ''
        continue-on-error: true  # a failed Windows build leaves the installer out of this release
        with: {name: BotTrack-windows, path: win}
      - name: Publish release
        if: github.ref == 'refs/heads/main' && env.RELEASES_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || secrets.BOTTRACK }}
        run: bash packaging/publish_release.sh "${{ github.run_number }}" "${{ vars.RELEASES_REPO || 'Chronik36/BotTrack-releases' }}"
      # Each release with its patch notes in your Discord channel, when the DISCORD_RELEASES_WEBHOOK secret is set
      # (Discord channel > Edit Channel > Integrations > Webhooks > New Webhook > Copy Webhook URL).
      - name: Post the release to Discord
        if: github.ref == 'refs/heads/main' && env.RELEASES_TOKEN != '' && env.DISCORD_WEBHOOK != ''
        continue-on-error: true  # Discord being down never fails a release
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
        run: |
          shopt -s nullglob
          python3 packaging/discord_post.py "${{ github.run_number }}" "${{ vars.RELEASES_REPO || 'Chronik36/BotTrack-releases' }}" notes.txt \
            "$( [ -n "$(echo win/*.exe)" ] && echo windows )" "$( [ -n "$(echo apk/*.apk)" ] && echo android )"

  # GitHub sometimes has no Mac machine free for hours ("The job was not acquired by Runner"), so the Mac job never
  # runs and nothing is released. Then this publishes the same code for the in-app Update, with the Windows
  # installer, the Android app and the last Mac installer (it updates itself to this code when opened).
  code-release:
    needs: [android, windows, build]
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.build.result != 'success' && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN || secrets.BOTTRACK }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
      REPO: ${{ vars.RELEASES_REPO || 'Chronik36/BotTrack-releases' }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Only for the newest commit on main (a newer push builds and releases itself)
        id: latest
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$head" = "$GITHUB_SHA" ] && [ -n "$RELEASES_TOKEN" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; else echo "Skipping: main is now $head"; fi
      - uses: actions/setup-python@v5
        if: steps.latest.outputs.go == '1'
        with: {python-version: "3.12"}
      - name: Tests (the Mac job's smoke test didn't run)
        if: steps.latest.outputs.go == '1'
        run: |
          python -m pip install --quiet -r requirements.txt pytest
          python -m pytest -q
      - name: Code for in-app updates, and the Manual
        if: steps.latest.outputs.go == '1'
        env:
          BOTTRACK_DEVELOPER_EMAIL: ${{ secrets.BOTTRACK_LOGS_TO }}
        run: |
          mkdir -p dist code/bottrack
          cp -R jigstream run.py requirements.txt code/bottrack/
          [ -n "${BOTTRACK_DEVELOPER_EMAIL:-}" ] && echo "$BOTTRACK_DEVELOPER_EMAIL" > code/bottrack/jigstream/developer.txt
          find code -name "__pycache__" -prune -exec rm -rf {} +
          (cd code && zip -qr ../dist/bottrack-code.zip bottrack)
          python packaging/export_manual.py dist/BotTrack-Manual.html || echo "manual export failed"
      - name: The last Mac installer
        if: steps.latest.outputs.go == '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || secrets.BOTTRACK }}
        run: |
          tag=$(gh release list -R "$REPO" -L 30 --json tagName -q '.[].tagName' | while read -r t; do
            if gh release view "$t" -R "$REPO" --json assets -q '.assets[].name' | grep -qx BotTrack.dmg; then echo "$t"; break; fi; done)
          [ -n "$tag" ] && gh release download "$tag" -R "$REPO" -p BotTrack.dmg -D dist
      - uses: actions/download-artifact@v4
        if: steps.latest.outputs.go == '1'
        continue-on-error: true
        with: {name: BotTrack-android, path: apk}
      - uses: actions/download-artifact@v4
        if: steps.latest.outputs.go == '1'
        continue-on-error: true
        with: {name: BotTrack-windows, path: win}
      - name: Publish release
        if: steps.latest.outputs.go == '1'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || secrets.BOTTRACK }}
        run: |
          bash packaging/publish_release.sh "${{ github.run_number }}" "$REPO" \
            "_No Mac build machine was free at GitHub, so this release has the new code (Update in the app picks it up) and the last Mac installer, which updates itself when opened._"
      - name: Post the release to Discord
        if: steps.latest.outputs.go == '1' && env.DISCORD_WEBHOOK != ''
        continue-on-error: true
        run: |
          shopt -s nullglob
          python3 packaging/discord_post.py "${{ github.run_number }}" "$REPO" notes.txt \
            "$( [ -n "$(echo win/*.exe)" ] && echo windows )" "$( [ -n "$(echo apk/*.apk)" ] && echo android )"
