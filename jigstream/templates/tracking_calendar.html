{% extends "base.html" %}{% block body %}
<div style="margin-bottom:14px"><a class="small" href="/tracking">‹ Shipping</a><h2 style="margin:2px 0 0">Delivery calendar</h2></div>
<div class="stats" id="csum"></div>
<div class="panel" style="padding:14px 16px;margin-top:14px">
<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px"><button class="ghost" id="cprev" aria-label="Previous month">‹</button><h3 id="cmon" style="margin:0;flex:1;text-align:center"></h3>
<span style="display:flex;gap:6px"><button class="ghost" id="ctoday">Today</button><button class="ghost" id="cnext" aria-label="Next month">›</button></span></div>
<div id="cgrid" class="cgrid"></div></div>
<div class="panel" style="padding:14px 16px;margin-top:14px"><div class="thead"><h3 id="cdh" style="margin:0">Pick a day</h3><span class="muted" id="cdc"></span></div><div id="cdd" class="muted small" style="margin-top:8px">Days with packages show a count.</div></div>
<div class="panel" id="cund" hidden style="padding:14px 16px;margin-top:14px"><h3 style="margin:0 0 6px">No delivery date yet</h3><div id="cu" class="small"></div></div>
<style>
.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.cdow{text-align:center;color:var(--muted);font-size:12px;font-weight:600;padding-bottom:2px}
.cday{min-width:0;overflow:hidden;aspect-ratio:1.3;border:1px solid var(--line);border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;justify-content:space-between;background:var(--surface)}
.cday.has{cursor:pointer;background:var(--accent-soft);border-color:var(--line-2)}.cday.has:hover{border-color:var(--accent)}
.cday.sel{outline:2px solid var(--accent)}.cday.tdy b{color:var(--accent)}.cday.out{opacity:.35}
.cday .n{align-self:flex-end;min-width:22px;text-align:center;border-radius:99px;background:var(--accent);color:#06122e;font-size:12px;font-weight:700;padding:1px 6px}
.cday.late .n{background:var(--red)}.cseg{height:8px;display:flex;border-radius:99px;overflow:hidden;margin:6px 0 10px}.cseg i{display:block}
.crow{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.cpill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--surface-2)}
.cday .n{box-sizing:border-box}
@media(max-width:700px){.cgrid{gap:4px}.cday{padding:4px 5px;aspect-ratio:1;border-radius:8px}.cday .n{min-width:18px;font-size:11px}}
</style>
<script>
(function(){
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const NAMES={{ states|tojson }},COL={delivered:"var(--green)",out:"var(--orange)",moving:"var(--accent)",late:"var(--red)",ordered:"var(--muted)"};
let D=[],view=new Date(),sel=null,T="";view.setDate(1);
const iso=d=>d.toLocaleDateString("sv");
function grid(){
  const y=view.getFullYear(),m=view.getMonth();document.getElementById("cmon").textContent=view.toLocaleString("en",{month:"long",year:"numeric"});
  const by={};D.forEach(r=>(by[r.date]=by[r.date]||[]).push(r));
  let h=["S","M","T","W","T","F","S"].map(x=>`<div class="cdow">${x}</div>`).join("");
  const start=new Date(y,m,1-new Date(y,m,1).getDay());
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const s=iso(d),rows=by[s]||[];
    h+=`<div class="cday${rows.length?" has":""}${s==sel?" sel":""}${s==T?" tdy":""}${d.getMonth()!=m?" out":""}${rows.some(r=>r.state=="late")?" late":""}" data-d="${s}" ${rows.length?'role="button" tabindex="0"':""}><b>${d.getDate()}</b>${rows.length?`<span class="n">${rows.length}</span>`:""}</div>`}
  document.getElementById("cgrid").innerHTML=h;
  document.querySelectorAll(".cday.has").forEach(c=>{const go=()=>{sel=c.dataset.d;grid();detail()};c.onclick=go;c.onkeydown=e=>{if(e.key=="Enter"||e.key==" "){e.preventDefault();go()}}});
}
function detail(){
  const rows=D.filter(r=>r.date==sel);if(!sel||!rows.length)return;
  document.getElementById("cdh").textContent=new Date(sel+"T12:00").toLocaleDateString("en",{weekday:"long",month:"short",day:"numeric"});
  document.getElementById("cdc").textContent=rows.length+(rows.length==1?" package":" packages");
  const cnt=k=>rows.reduce((a,r)=>(a[r[k]]=(a[r[k]]||0)+1,a),{}),st=cnt("state");
  const line=o=>Object.entries(o).map(([k,v])=>`${esc(NAMES[k]||k)} <b>${v}</b>`).join(" · ");
  document.getElementById("cdd").innerHTML=`<div class="cseg">${Object.entries(st).map(([k,v])=>`<i style="flex:${v};background:${COL[k]}" title="${esc(NAMES[k]||k)}"></i>`).join("")}</div>
   <div style="color:var(--text)">${line(st)}</div><div style="margin-top:4px">Carrier: ${line(cnt("carrier"))}<br>Retailer: ${line(cnt("retailer"))}</div>
   <div style="margin-top:8px">${rows.map(r=>`<div class="crow"><span style="color:var(--text)">${esc(r.title)}<br><span class="muted">${esc(r.retailer)} · ${esc(r.carrier)} ${esc(r.tracking)}</span></span><span class="cpill" style="color:${COL[r.state]}">${esc(NAMES[r.state]||r.state)}</span></div>`).join("")}</div>`;
}
fetch("/tracking/calendar/data").then(r=>r.json()).then(x=>{D=x.rows;T=x.today;const s=x.summary;
  document.getElementById("csum").innerHTML=[["In transit",s.in_transit,""],["Arriving today",s.today,""],["Running late",s.late,"var(--orange)"]]
    .map(([l,v,c])=>`<div class="card">${l} <b${c?` style="color:${c}"`:""}>${v}</b></div>`).join("");
  if(x.undated.length){document.getElementById("cund").hidden=false;document.getElementById("cu").innerHTML=x.undated.map(r=>`<div class="crow"><span>${esc(r.title)} <span class="muted">· ${esc(r.retailer)}</span></span><span class="cpill">${esc(NAMES[r.state]||r.state)}</span></div>`).join("")}
  sel=D.some(r=>r.date==T)?T:null;grid();detail()});
document.getElementById("cprev").onclick=()=>{view.setMonth(view.getMonth()-1);grid()};
document.getElementById("cnext").onclick=()=>{view.setMonth(view.getMonth()+1);grid()};
document.getElementById("ctoday").onclick=()=>{view=new Date();view.setDate(1);sel=T;grid();detail()};
})();
</script>{% endblock %}
