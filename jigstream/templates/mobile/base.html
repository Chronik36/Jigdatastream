<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BotTrack</title>
<meta name="theme-color" content="#0b1436"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="BotTrack">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="{{url_for('mobile.manifest')}}"><link rel="apple-touch-icon" href="{{url_for('static', filename='icon.png')}}">
<link rel="icon" href="{{url_for('static', filename='icon.png')}}">
<style>
@font-face{font-family:Inter;font-weight:400;font-display:swap;src:url("{{url_for('static', filename='fonts/inter-400.woff2')}}") format("woff2")}
@font-face{font-family:Inter;font-weight:600;font-display:swap;src:url("{{url_for('static', filename='fonts/inter-600.woff2')}}") format("woff2")}
@font-face{font-family:Inter;font-weight:700;font-display:swap;src:url("{{url_for('static', filename='fonts/inter-700.woff2')}}") format("woff2")}
:root{color-scheme:dark;--bg:#132048;--surface:#0b1436;--surface-2:#111c46;--line:#233270;--line-2:#304284;--text:#e8eeff;--muted:#8e9bc6;
  --accent:#3dd8ef;--accent-soft:rgba(61,216,239,.12);--blue:#2f86f6;--green:#3ddc84;--green-soft:rgba(61,220,132,.12);--red:#ff6b7a;--orange:#ff8a3d;
  --grad:linear-gradient(90deg,var(--blue),var(--accent) 55%,var(--green));--top:env(safe-area-inset-top,0px);--bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(var(--top) + 10px) 16px 10px;background:rgba(11,20,54,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--grad);opacity:.55}
header h1{font-size:19px;margin:0;flex:1;letter-spacing:-.01em}
header .back{font-size:26px;line-height:1;padding:0 6px 2px 0}
header .add{font-size:15px;font-weight:600;background:var(--accent-soft);border-radius:999px;padding:6px 14px}
main{padding:14px 16px calc(var(--bottom) + 90px);max-width:720px;margin:auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:rgba(11,20,54,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:var(--bottom)}
nav.tabs a{flex:1;text-align:center;padding:10px 0 12px;color:var(--muted);font-size:12px;font-weight:600}
nav.tabs a svg{display:block;margin:0 auto 3px;width:24px;height:24px}
nav.tabs a.on{color:var(--accent)}
.flash{background:var(--accent-soft);border:1px solid rgba(61,216,239,.35);border-radius:12px;padding:10px 14px;margin-bottom:12px}
.muted{color:var(--muted)}.small{font-size:13px}
.list{list-style:none;margin:0;padding:0}
.row{display:block;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;color:var(--text)}
.row .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.row b{font-weight:600}.row .amt{font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;background:var(--surface-2);border:1px solid var(--line-2);color:var(--muted)}
.s-delivered{color:var(--green);background:var(--green-soft)}.s-shipped,.s-in_transit,.s-out_for_delivery{color:var(--accent);background:var(--accent-soft)}
.s-cancelled,.s-returned,.s-refunded,.s-exception{color:var(--red)}.s-ordered,.s-processing{color:var(--orange)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px;scrollbar-width:none}
.chips a{white-space:nowrap;border:1px solid var(--line-2);border-radius:999px;padding:5px 12px;font-size:14px;color:var(--muted)}
.chips a.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
input,select,textarea{font:inherit;font-size:16px;width:100%;background:var(--surface-2);color:var(--text);border:1px solid var(--line-2);border-radius:12px;padding:11px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
label{display:block;color:var(--muted);font-size:13px;font-weight:600;margin:0 0 12px}label input,label select,label textarea{margin-top:5px}
fieldset{border:1px solid var(--line);border-radius:14px;background:var(--surface);margin:0 0 14px;padding:12px 14px 2px}
legend{color:var(--accent);font-weight:600;padding:0 6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
button{font:inherit;font-weight:600;width:100%;cursor:pointer;border:0;border-radius:12px;padding:13px;background:linear-gradient(135deg,var(--blue),var(--accent));color:#04122a}
button.danger{background:transparent;color:var(--red);border:1px solid rgba(255,107,122,.4);margin-top:10px}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line-2);width:auto;padding:6px 12px;font-size:14px}
.check{display:flex;align-items:center;gap:10px;color:var(--text);font-weight:500}.check input{width:auto}
.search{margin-bottom:12px}
</style></head><body>
<header>{% block back %}{% endblock %}<h1>{% block title %}BotTrack{% endblock %}</h1>{% block action %}{% endblock %}</header>
<main>{% for m in get_flashed_messages() %}<div class="flash">{{m}}</div>{% endfor %}{% block body %}{% endblock %}</main>
{% if tab %}<nav class="tabs">
<a href="{{url_for('mobile.orders')}}" class="{{'on' if tab == 'orders'}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/></svg>Orders</a>
<a href="{{url_for('mobile.expenses')}}" class="{{'on' if tab == 'expenses'}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/></svg>Expenses</a>
<a href="{{url_for('mobile.profiles')}}" class="{{'on' if tab == 'profiles'}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Profiles</a>
</nav>{% endif %}
</body></html>
