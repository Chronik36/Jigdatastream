<style>
/* Every page fits its window, however narrow, with no scroll bars inside it: grid columns shrink, tables
   that can't fit across turn into cards, and narrow tables wrap their text instead of scrolling sideways. */
.shell,main{min-width:0}
main{overflow-x:clip}
main .playout>*,main .cols>*,main .grid>*,main .xgrid>*,main .dgrid>*,main .igrid>*,main .panel{min-width:0}
main textarea,main input,main select{max-width:100%;box-sizing:border-box}
main svg:not(.i),main img{max-width:100%}
main img{height:auto}
main table:not(.cardy) td,main table.wrapt th{overflow-wrap:anywhere}
main table.wrapt td,main table.wrapt th{white-space:normal}
/* Boxes that still have to scroll up and down (side panes, dialogs, long previews) scroll without a bar. */
main *,dialog,dialog *,.snav{scrollbar-width:none}
main *::-webkit-scrollbar,dialog::-webkit-scrollbar,dialog *::-webkit-scrollbar,.snav::-webkit-scrollbar{display:none;width:0;height:0}
@media (max-width:900px){
  body .playout{grid-template-columns:minmax(0,1fr)}
  main svg:not(.i){height:auto}
}
@media (max-width:700px){
  main{max-width:100vw;overflow-x:clip}
  table.cardy,table.cardy tbody{display:block;border:0;background:none;overflow:visible}
  table.cardy thead{display:none}
  table.cardy tr{display:block;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;margin-bottom:10px}
  table.cardy td{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:space-between;align-items:baseline;border:0;padding:5px 0;text-align:right;white-space:normal}
  table.cardy td>*{min-width:0;max-width:100%;overflow-wrap:anywhere;flex-wrap:wrap}
  table.cardy td>details,table.cardy td>table{flex:1 1 100%}
  table.cardy td>form,table.cardy td>select{margin-left:auto}
  table.cardy td:first-child{white-space:normal}
  table.cardy td:before{content:attr(data-label);color:var(--muted);font-size:12px;font-weight:600;text-align:left;flex:none;max-width:40%}
  table.cardy td[data-label=""]:before{display:none}
  table.cardy td[data-label=""]{justify-content:flex-start;text-align:left}

}
/* A table too wide for its space turns into cards at any window size, instead of scrolling sideways. */
  table.cardy.stack,table.cardy.stack tbody{display:block;border:0;background:none;overflow:visible}
  table.cardy.stack tbody{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:10px;align-items:start}
  table.cardy.stack tbody>tr{margin:0}
  table.cardy.stack thead{display:none}
  table.cardy.stack tr{display:block;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;margin-bottom:10px}
  table.cardy.stack td{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:space-between;align-items:baseline;border:0;padding:5px 0;text-align:right;white-space:normal}
  table.cardy.stack td>*{min-width:0;max-width:100%;overflow-wrap:anywhere;flex-wrap:wrap}
  table.cardy.stack td>details,table.cardy.stack td>table{flex:1 1 100%}
  table.cardy.stack td>form,table.cardy.stack td>select{margin-left:auto}
  table.cardy.stack td:first-child{white-space:normal}
  table.cardy.stack td:before{content:attr(data-label);color:var(--muted);font-size:12px;font-weight:600;text-align:left;flex:none;max-width:40%}
  table.cardy.stack td[data-label=""]:before{display:none}
  table.cardy.stack td[data-label=""]{justify-content:flex-start;text-align:left}
</style>
<script>
(function () {
  // Cards when a table can't fit across its box, back to a table when there's room again.
  // A table too narrow to card (fewer than 3 columns) wraps its text instead.
  function room(box) {
    var s = getComputedStyle(box);
    return box.clientWidth - parseFloat(s.paddingLeft) - parseFloat(s.paddingRight);
  }
  function fit(t) {
    var box = t.parentElement;
    if (!box) return;
    var kind = t.classList.contains('cardy') ? 'stack' : 'wrapt';
    t.classList.remove(kind);
    if (t.scrollWidth > room(box) + 1) t.classList.add(kind);
  }
  function fitAll() { document.querySelectorAll('main table').forEach(fit); }
  var resizing;
  function later() { clearTimeout(resizing); resizing = setTimeout(fitAll, 120); }
  addEventListener('resize', later);
  document.addEventListener('toggle', later, true);  // an opened <details> can make its table wider
  var main = document.querySelector('main');
  if (main && window.ResizeObserver) new ResizeObserver(later).observe(main);  // sidebar folding changes the width too
  document.querySelectorAll('main table').forEach(function (t) {
    // Label each cell with its column, so a narrow window can show the rows as cards.
    var first = t.querySelector(':scope>tbody>tr');
    if (!t.tHead && first && first.children.length && Array.prototype.every.call(first.children, function (c) { return c.tagName === 'TH'; })) {
      t.createTHead().appendChild(first);  // a header row written inside the body still names the columns
    }
    var heads = Array.prototype.map.call(t.querySelectorAll(':scope>thead th'), function (th) { return th.textContent.trim(); });
    if (heads.length >= 3 && !t.classList.contains('nocard')) {
      t.querySelectorAll(':scope>tbody>tr').forEach(function (tr) {  // not the rows of a table nested in a cell
        Array.prototype.forEach.call(tr.children, function (td, i) { td.setAttribute('data-label', td.colSpan > 1 ? '' : (heads[i] || '')); });
      });
      t.classList.add('cardy');
    }
    fit(t);
  });
})();
</script>
