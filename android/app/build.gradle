plugins { id "com.android.application" }

android {
    namespace "com.bottrack.app"
    compileSdk 34
    defaultConfig {
        applicationId "com.bottrack.app"
        minSdk 24
        targetSdk 34
        // Raise versionCode whenever anything in android/ changes: phones running an older number are
        // offered the new app (the release asset is named BotTrack-android-<versionCode>.apk).
        versionCode 3
        versionName "1.2"
    }
    // A fixed key lets testers install updates over the old app. CI passes it from repository
    // secrets; without them the build falls back to the debug key, which can't update older installs.
    signingConfigs {
        beta {
            def ks = System.getenv("ANDROID_KEYSTORE_FILE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: "bottrack"
                keyPassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv("ANDROID_KEYSTORE_FILE") ? signingConfigs.beta : signingConfigs.debug
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Google's QR scanner: its camera screen comes from Google Play services, so the app needs no
    // camera permission. Phones without Play services paste the link instead.
    implementation "com.google.android.gms:play-services-code-scanner:16.1.0"
}
